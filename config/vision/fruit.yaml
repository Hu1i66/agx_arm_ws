# 水果检测 ROS 参数（object_detector）
# 冻结基线（计划 3.4）：d455 默认开启，dabai 默认关闭，GUI 内嵌模式，深度配对延迟开启。
# 本文件不重复存外参数值——外参统一读 config/calibration/d455_eye_to_hand.json。
object_detector:
  ros__parameters:
    # ── 相机开关与模式 ──
    d455.enabled: true
    dabai.enabled: false
    show_gui_window: false
    depth_pair_delay: true
    # Explicit GPU selection prevents a silent CPU fallback.
    yolo_device: "cuda:0"
    # ── D455 偏差补偿（当前生产默认值）──
    d455.use_depth_camera: true
    d455.yolo_conf: 0.20
    d455.yolo_iou: 0.45
    d455.yolo_agnostic_nms: true
    d455.min_track_hits: 2
    d455.belt_filter: true
    d455.x_offset_m: 0.0
    d455.y_offset_m: 0.0
    d455.z_offset_m: 0.0
    d455.depth_offset_m: 0.0
    # ── 通用滤波与周期（当前默认值）──
    filter_alpha: 0.25
    filter_match_dist_px: 80.0
    filter_max_misses: 10
    detect_period_s: 0.1
    base_frame_id: base_link

    # Dabai单次静态抓取：同一水果的重叠框去重，D455沿用原检测参数。
    dabai.yolo_conf: 0.16
    dabai.yolo_iou: 0.45
    dabai.yolo_agnostic_nms: true
    dabai.min_track_hits: 3
    dabai.belt_filter: true
    dabai.preprocess_clahe: true
    dabai.clahe_clip_limit: 2.0
    dabai.inference_size: 960
    dabai.tta: true
    dabai.bbox_expand_ratio: 0.08
    dabai.merge_fragments: true
    dabai.refine_bbox: true
